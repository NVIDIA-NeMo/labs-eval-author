name: Validate PR title

on:
  pull_request:
    branches: [main, ci/skillevaluator-reports]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-pull-request:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata only: do not check out or execute code from the PR.
      - name: Semantic PR Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: PR Title length
        if: always()
        shell: bash
        run: |
          title_length="$(jq -er '.pull_request.title | strings | length' "$GITHUB_EVENT_PATH")"
          test "$title_length" -le 100
