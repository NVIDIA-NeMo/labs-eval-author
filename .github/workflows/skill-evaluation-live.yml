name: SkillEvaluator Tier 2 and 3

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Authorize provider calls and Docker agent execution
        type: boolean
        default: false
      tier:
        description: Tiers to evaluate
        type: choice
        options: ['2', '3', both]
        default: '2'
      skill:
        description: Skill directory name, or all (similarity always uses the collection)
        type: string
        default: all
      provider:
        description: Hosted provider for embeddings, grading, and OpenCode
        type: choice
        options: [nv_build, openai]
        default: nv_build

permissions:
  contents: read

concurrency:
  group: skill-evaluation-live
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Report selected skills and dataset coverage without model calls
        env:
          EVALUATION_TIER: ${{ inputs.tier }}
          EVALUATION_SKILL: ${{ inputs.skill }}
          EVALUATION_PROVIDER: ${{ inputs.provider }}
        run: |
          python tools/collect_live_skill_evaluations.py --tier "$EVALUATION_TIER" --skill "$EVALUATION_SKILL" --provider "$EVALUATION_PROVIDER" --output "$RUNNER_TEMP/skill-plan"
          cat "$RUNNER_TEMP/skill-plan/live-skillevaluator-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skill-evaluation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-plan/live-skillevaluator-summary.*
          retention-days: 30
          if-no-files-found: warn

  live:
    needs: plan
    if: >-
      inputs.run_live && github.ref == 'refs/heads/main' &&
      vars.SKILL_EVALUATION_LIVE_ENABLED == 'true'
    environment: skill-evaluation-live
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
          python-version: '3.12'
          enable-cache: false
      - name: Install isolated Tier 2 and 3 runtime
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/live-evaluator-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/live-evaluator-bin
        run: |
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          uv tool install --python 3.12 'skillevaluator[tier2,tier3] @ git+https://github.com/NVIDIA/SkillEvaluator.git@7e189c6bdada8910dfa1684f25feedca87f2db85'
      - name: Run advisory evaluations
        if: ${{ !cancelled() }}
        env:
          EVALUATION_TIER: ${{ inputs.tier }}
          EVALUATION_SKILL: ${{ inputs.skill }}
          EVALUATION_PROVIDER: ${{ inputs.provider }}
          NVIDIA_API_KEY: ${{ inputs.provider == 'nv_build' && secrets.NVIDIA_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          SKILL_EVAL_LLM_MODEL: ${{ vars.SKILL_EVAL_LLM_MODEL }}
          SKILL_EVAL_EMBEDDING_MODEL: ${{ vars.SKILL_EVAL_EMBEDDING_MODEL }}
          SKILL_EVAL_AGENT_MODEL: ${{ vars.SKILL_EVAL_AGENT_MODEL }}
        run: |
          python tools/collect_live_skill_evaluations.py --run --tier "$EVALUATION_TIER" --skill "$EVALUATION_SKILL" --provider "$EVALUATION_PROVIDER" --output "$RUNNER_TEMP/skill-live"
      - name: Show sanitized summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/skill-live/live-skillevaluator-summary.md"; then
            cat "$RUNNER_TEMP/skill-live/live-skillevaluator-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skill-evaluations-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-live/live-skillevaluator-summary.*
          retention-days: 30
          if-no-files-found: warn
