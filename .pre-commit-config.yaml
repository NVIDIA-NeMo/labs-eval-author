default_install_hook_types: [commit-msg]

repos:
  - repo: local
    hooks:
      - id: check-signoff
        name: Check commit is signed off (DCO)
        entry: "grep -qE '^Signed-off-by: .+ <.+>'"
        language: system
        stages: [commit-msg]
        always_run: true
